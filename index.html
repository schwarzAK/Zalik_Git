
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Love Web Programming</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: linear-gradient(135deg, #ffe0ec, #ff9ebc);
            font-family: Arial, sans-serif;
        }

        h1 {
            color: #d6336c;
            font-size: 45px;
            text-align: center;
            z-index: 1;
            animation: pulse 2s infinite;
        }

        .heart {
            position: absolute;
            bottom: -50px;
            color: #ff2e75;
            font-size: 30px;
            animation: float 6s linear infinite;
        }

        .heart:nth-child(1) { left: 10%; animation-delay: 0s; }
        .heart:nth-child(2) { left: 25%; animation-delay: 2s; }
        .heart:nth-child(3) { left: 45%; animation-delay: 1s; }
        .heart:nth-child(4) { left: 65%; animation-delay: 3s; }
        .heart:nth-child(5) { left: 80%; animation-delay: 1.5s; }
        .heart:nth-child(6) { left: 90%; animation-delay: 4s; }

        @keyframes float {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }
            20% {
                opacity: 1;
            }
            100% {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
    </style>
</head>

<body>
    <div class="heart">♥</div>
    <div class="heart">♥</div>
    <div class="heart">♥</div>
    <div class="heart">♥</div>

    <div class="heart">♥</div>

</body>
</html>
